[project]
name = "auth-security-suite"
version = "0.1.0"
description = "FastAPI security testing suite with Playwright brute-force runner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "playwright>=1.49.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.3.0"]

[project.scripts]
auth-security-suite = "auth_security_suite.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
